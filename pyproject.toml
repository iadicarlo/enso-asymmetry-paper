[project]
name = "enso-asymmetry"
version = "0.1.0"
description = "Figure and analysis code for: Pacific warming pattern sets which ENSO phase strengthens under global warming"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
dependencies = [
    "ultraplot>=1.70",
    "matplotlib>=3.10",
    "xarray>=2025.1",
    "netcdf4>=1.7",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "cartopy>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ensoasym"]
